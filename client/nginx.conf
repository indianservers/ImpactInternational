server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 client_max_body_size 32k;
 location /api/ { proxy_pass http://api:5080; proxy_set_header Host $host; }
 location /health { proxy_pass http://api:5080; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
