server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 client_max_body_size 12m;
 location ~ ^/api/v1/documents/[0-9a-f-]+/download$ {
  proxy_pass http://api:5080;
  proxy_set_header Host $http_host;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Content-Security-Policy;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options nosniff always;
 }
 location /api/ {
  proxy_pass http://api:5080;
  proxy_set_header Host $http_host;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 90s;
 }
 location /health { proxy_pass http://api:5080; proxy_set_header Host $host; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
